name: CI/CD Pipeline

# TEMPORARILY DISABLED - GitHub Actions paused
# on:
#   push:
#     branches: [ main, develop ]
#   pull_request:
#     branches: [ main ]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '18'

jobs:
  # Test and Quality Checks
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv pip install --system -r uv.lock
        uv pip install --system pytest pytest-cov pytest-asyncio httpx bandit safety

    - name: Create test environment
      run: |
        cp .env.example .env
        echo "SKIP_CONFIG_VALIDATION=true" >> .env
        echo "STEEL_API_KEY=test_key" >> .env
        echo "ANTHROPIC_API_KEY=test_key" >> .env
        echo "SECRET_KEY=test_secret_key_minimum_32_chars_long" >> .env
        echo "CREDENTIAL_ENCRYPTION_KEY=test_encryption_key_32_chars_123" >> .env

    - name: Run tests with coverage
      run: |
        pytest --cov=app --cov-report=xml --cov-report=term-missing -v
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # Code Quality Checks
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv pip install --system -r uv.lock
        uv pip install --system ruff mypy bandit safety

    - name: Run Ruff (linting)
      run: ruff check app/ --output-format=github

    - name: Run Ruff (formatting)
      run: ruff format app/ --check

    - name: Run MyPy (type checking)
      run: mypy app/ --ignore-missing-imports

    - name: Run Bandit (security)
      run: bandit -r app/ -f json -o bandit-report.json || true

    - name: Upload Bandit results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: bandit-report.json

    - name: Check dependencies for vulnerabilities
      run: safety check --json || true

  # Security Scanning
  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  # Docker Build and Security Scan
  docker:
    runs-on: ubuntu-latest
    needs: [test, quality]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: steel-run:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Docker security scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: steel-run:latest
        format: 'sarif'
        output: 'docker-trivy-results.sarif'

    - name: Upload Docker scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'docker-trivy-results.sarif'

  # Performance Testing
  performance:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv pip install --system -r uv.lock
        uv pip install --system locust

    - name: Create test environment
      run: |
        cp .env.example .env
        echo "SKIP_CONFIG_VALIDATION=true" >> .env
        echo "STEEL_API_KEY=test_key" >> .env
        echo "ANTHROPIC_API_KEY=test_key" >> .env
        echo "SECRET_KEY=test_secret_key_minimum_32_chars_long" >> .env
        echo "CREDENTIAL_ENCRYPTION_KEY=test_encryption_key_32_chars_123" >> .env

    - name: Run performance tests
      run: |
        # Start the application in background
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
        
        # Run basic load test
        locust -f tests/performance/locustfile.py --host=http://localhost:8000 \
               --users 10 --spawn-rate 2 --run-time 60s --headless

  # Deploy to staging (on main branch)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test, quality, security, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGISTRY_URL }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.REGISTRY_URL }}/steel-run:staging-${{ github.sha }}
          ${{ secrets.REGISTRY_URL }}/steel-run:staging-latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to staging
      run: |
        # Add deployment script here
        echo "Deploying to staging environment..."
        # This would typically use kubectl, helm, or cloud provider APIs

  # Deploy to production (on release tags)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [test, quality, security, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGISTRY_URL }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.REGISTRY_URL }}/steel-run:${{ steps.version.outputs.VERSION }}
          ${{ secrets.REGISTRY_URL }}/steel-run:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to production
      run: |
        # Add production deployment script here
        echo "Deploying version ${{ steps.version.outputs.VERSION }} to production..."
        # This would typically use kubectl, helm, or cloud provider APIs

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        release_name: Release ${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false