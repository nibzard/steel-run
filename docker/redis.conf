# Redis configuration for Steel.run

# Basic settings
bind 0.0.0.0
port 6379
timeout 300
keepalive 60

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Security (password will be set via environment variable)
# requirepass will be set by docker command

# Logging
loglevel notice
logfile ""

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG "CONFIG_9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d"

# Performance tuning
tcp-keepalive 300
tcp-backlog 511

# Limits
maxclients 10000